services:
  
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: insurance_backend

    ports:
      - "8000:8000"

    networks:
      - insurance_network 

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: insurance_frontend

    ports:
      - "8501:8501"

    environment:
      - API_URL=http://backend:8000

    depends_on:
      - backend

    networks:
      - insurance_network

networks:
  insurance_network:
    driver: bridge